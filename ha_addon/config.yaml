name: "Xiaomi Mi Scale (modernized)"
version: "0.4.2"
slug: xiaomi_mi_scale
description: "BLE reader for Xiaomi Mi Scale with adaptive multi-user support and dual actionable notifications"
url: "https://github.com/lolouk44/xiaomi_mi_scale"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
host_network: true
host_dbus: true
usb: true
privileged:
  - NET_ADMIN
  - NET_RAW
hassio_api: false
homeassistant_api: false

options:
  MISCALE_MAC: "00:00:00:00:00:00"
  MQTT_HOST: "core-mosquitto"
  MQTT_PORT: 1883
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
  MQTT_PREFIX: "miscale"
  MQTT_RETAIN: true
  MQTT_DISCOVERY: true
  MQTT_DISCOVERY_PREFIX: "homeassistant"
  HCI_DEV: "hci0"
  TIME_INTERVAL: 30
  DEBUG_LEVEL: "INFO"
  BLUEPY_PASSIVE_SCAN: false
  NOTIFY_ALEXA: false
  ALEXA_MEDIA_TOPIC: ""
  NOTIFY_MOBILE: false
  MOBILE_NOTIFY_TOPIC: ""
  USERS:
    - NAME: "User1"
      GT: 50
      LT: 80
      SEX: "male"
      HEIGHT: 175
      DOB: "1985-01-01"

schema:
  MISCALE_MAC: str
  MQTT_HOST: str
  MQTT_PORT: int?
  MQTT_USERNAME: str?
  MQTT_PASSWORD: str?
  MQTT_PREFIX: str?
  MQTT_RETAIN: bool?
  MQTT_DISCOVERY: bool?
  MQTT_DISCOVERY_PREFIX: str?
  HCI_DEV: str?
  TIME_INTERVAL: int?
  DEBUG_LEVEL: list(CRITICAL|ERROR|WARNING|INFO|DEBUG|NOTSET)?
  BLUEPY_PASSIVE_SCAN: bool?
  NOTIFY_ALEXA: bool?
  ALEXA_MEDIA_TOPIC: str?
  NOTIFY_MOBILE: bool?
  MOBILE_NOTIFY_TOPIC: str?
  USERS:
    - NAME: str
      GT: float
      LT: float
      SEX: list(male|female)
      HEIGHT: int
      DOB: str
